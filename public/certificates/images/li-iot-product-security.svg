<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="liBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2"/>
      <stop offset="100%" stop-color="#004182"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="640" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Left Accent Tech Strip -->
  <path d="M 20 32 Q 20 20 32 20 L 50 20 L 50 660 L 32 660 Q 20 660 20 648 Z" fill="url(#liBlue)"/>

  <!-- Header Bar -->
  <g transform="translate(80, 80)">
    <!-- LinkedIn Logo in SVG -->
    <rect x="0" y="0" width="42" height="42" rx="8" fill="#0a66c2"/>
    <text x="21" y="29" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
    <text x="56" y="28" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" fill="#0f172a">Learning</text>

    <!-- Certificate of Completion Badge -->
    <text x="820" y="26" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="end" letter-spacing="1">CERTIFICATE OF COMPLETION</text>
  </g>

  <!-- Thin separating rule -->
  <line x1="80" y1="140" x2="900" y2="140" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Body Content -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0a66c2" letter-spacing="2">CONGRATULATIONS,</text>
    
    <!-- Recipient Name -->
    <text x="0" y="55" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="bold" fill="#0f172a" letter-spacing="-0.5">Sakthi Kailash P</text>

    <!-- Completion Text -->
    <text x="0" y="105" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#475569">has successfully completed the industry certification course</text>

    <!-- Course Title (Highlighted Box) -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="820" height="70" rx="8" fill="#f0f7ff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="24" y="44" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="bold" fill="#0369a1">IoT Product Security</text>
    </g>

    <!-- Details: Completion Date & Skills -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b">COMPLETED ON:</text>
      <text x="130" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">May 2026</text>

      <text x="0" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b">TOP SKILLS:</text>
      <text x="130" y="30" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0284c7" font-weight="600">IoT Security • Embedded Systems • Hardware Encryption</text>
    </g>
  </g>

  <!-- Signatures & Verification Footer -->
  <g transform="translate(80, 560)">
    <!-- Signature Line -->
    <g transform="translate(0, 0)">
      <!-- Stylized Vector Signature -->
      <path d="M 0 0 Q 30 -20, 60 5 T 140 -10 T 200 0" fill="none" stroke="#0a66c2" stroke-width="2.5"/>
      <line x1="0" y1="18" x2="220" y2="18" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="34" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Dan Brodnitz</text>
      <text x="0" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#64748b">VP, Global Content, LinkedIn Learning</text>
    </g>

    <!-- Official Badge Ribbon -->
    <g transform="translate(420, 10)">
      <circle cx="30" cy="15" r="28" fill="url(#liBlue)"/>
      <circle cx="30" cy="15" r="23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="30" y="19" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Verification & Cert ID -->
    <g transform="translate(820, 15)" text-anchor="end">
      <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" fill="#64748b">CERTIFICATE ID: <tspan font-weight="bold" fill="#0f172a">LI-IOT-SEC-02</tspan></text>
      <text x="0" y="18" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#0a66c2">linkedin.com/learning/certificates</text>
    </g>
  </g>
</svg>